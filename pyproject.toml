[project]
name = "friction-ledger"
version = "0.1.0"
description = "A public-data study of why health-insurance refunds get stuck, where every chart shows its evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.3.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]
# Runtime packages land with their phase (CLAUDE.md → Conventions allowlist):
# duckdb (Phase 1); pyyaml, httpx (Phase 2); anthropic (Phase 6);
# snowflake-connector-python (Phase 10). Nothing before it is needed.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.16.3", # keep in lockstep with .pre-commit-config.yaml rev
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
markers = [
    "slow: an integration test kept out of the fast edit-loop hook because it dominates suite runtime — it builds a DuckDB warehouse or spawns many make subprocesses. The hook runs `-m \"not slow\"`; `make test` and CI run the suite plain, so slow tests always run there. --strict-markers makes a typo'd or unregistered mark fail loud, so a new slow module cannot silently rejoin the fast set.",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B",
  # The mechanical half of .claude/skills/code-craft: function shape
  # (complexity, branches, statements, positional arguments), no boolean flag
  # parameter, simplifiable forms, commented-out code, unused arguments.
  "C90", "PLR0912", "PLR0915", "PLR0917",
  "FBT", "SIM", "RET", "PIE", "ERA", "ARG",
  "RUF100",  # a noqa that suppresses nothing is deleted, not kept
  # Tagged comments (code-craft → Comments): TODO carries a record in its
  # parens and a colon; FIXME and XXX are refused outright. HACK is allowed
  # (FIX004 off) and TODO is allowed (FIX002 off) because scripts/check_docs.py
  # checks that each one points at a record entry that exists; TD003 is off
  # because that record entry is the link.
  "TD", "FIX",
]
ignore = ["TD003", "FIX002", "FIX004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
# Fixtures, callbacks and lambdas take the signature pytest or the caller
# hands them; a boolean parametrize value is the case under test.
"tests/**" = ["ARG", "FBT"]
