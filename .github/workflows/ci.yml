name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: nothing here writes to the repo. The weekly scrape (Phase 4,
# weekly.yml) is the ONE workflow that will hold contents: write, scoped to
# data/snapshots/. Superseded runs on the same ref are cancelled.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `make lint` executes a third-party pre-commit hook; it must not find
          # a usable token in .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.5" # match local; bump deliberately
      # --locked: fail on a stale lock instead of silently re-resolving.
      - run: uv sync --locked
      - run: make lint
      - run: make check-docs
      - run: make check-backing
      - run: make test
      # DuckDB, offline, no key: rebuilding the synthetic fixture is a free
      # graceful-degradation proof on every run (no model is imported).
      - run: make rebuild FIXTURE=synthetic
      - run: make idempotency-check
      # The frozen App Store sample through the real parser and the same load
      # guard: the scraper path, proven offline (no fetch — `make scrape` is
      # developer-run and never appears here).
      - run: make rebuild FIXTURE=app-store
      - run: make idempotency-check FIXTURE=app-store
